<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weather — Current Conditions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1B1F3B;
    --bg-soft:#242A52;
    --panel:#262C50;
    --line:#3B4270;
    --text:#F5F3FF;
    --muted:#9095B8;
    --lavender:#A9B4E8;
    --coral:#FF8966;
    --radius:16px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 20% -10%, #2E355E 0%, transparent 55%),
      radial-gradient(circle at 90% 10%, #2A2F58 0%, transparent 45%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:36px 18px;
  }

  .app{
    width:100%;
    max-width:480px;
  }

  .top-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--muted);
    text-align:center;
    margin-bottom:18px;
  }

  form.search{
    display:flex;
    gap:8px;
    margin-bottom:22px;
  }
  form.search input{
    flex:1;
    background:var(--panel);
    border:1.5px solid var(--line);
    color:var(--text);
    font-family:'Inter', sans-serif;
    font-size:14.5px;
    padding:12px 15px;
    border-radius:10px;
    outline:none;
    transition: border-color 0.15s ease;
  }
  form.search input::placeholder{ color:var(--muted); }
  form.search input:focus{ border-color:var(--lavender); }
  form.search button{
    background:var(--coral);
    color:#1B1F3B;
    border:none;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14px;
    padding:0 20px;
    border-radius:10px;
    cursor:pointer;
    transition: background 0.15s ease;
  }
  form.search button:hover{ background:#ffa085; }
  form.search button:disabled{ background:var(--muted); cursor:default; }

  .geo-btn{
    display:block;
    margin:0 auto 26px;
    background:none;
    border:1px solid var(--line);
    color:var(--muted);
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .geo-btn:hover{ border-color:var(--lavender); color:var(--lavender); }

  .card{
    background: linear-gradient(165deg, var(--panel) 0%, var(--bg-soft) 100%);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:34px 30px;
    min-height:260px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    position:relative;
    overflow:hidden;
  }

  .state-msg{
    color:var(--muted);
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
  }
  .state-msg.error{ color:var(--coral); }

  .result{ display:none; width:100%; }
  .result.visible{ display:block; }

  .place{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:18px;
    margin-bottom:2px;
  }
  .place-sub{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--muted);
    letter-spacing:0.05em;
    margin-bottom:22px;
  }

  .icon-wrap{ margin-bottom:8px; }
  .icon-wrap svg{ width:72px; height:72px; }

  .temp-row{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    gap:6px;
    margin-bottom:6px;
  }
  .temp{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:64px;
    line-height:1;
    letter-spacing:-0.02em;
  }
  .unit-toggle{
    display:flex;
    flex-direction:column;
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    color:var(--muted);
    margin-top:6px;
  }
  .unit-toggle button{
    background:none;
    border:none;
    color:var(--muted);
    font-family:'IBM Plex Mono', monospace;
    font-size:14px;
    cursor:pointer;
    padding:1px 0;
  }
  .unit-toggle button.active{ color:var(--coral); font-weight:600; }

  .condition{
    font-size:15px;
    color:var(--lavender);
    margin-bottom:26px;
  }

  .stats{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:10px;
    width:100%;
    border-top:1px solid var(--line);
    padding-top:20px;
  }
  .stat{ text-align:center; }
  .stat .k{
    font-family:'IBM Plex Mono', monospace;
    font-size:10px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:4px;
  }
  .stat .v{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:16px;
  }

  .updated{
    margin-top:20px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--muted);
    text-align:center;
  }

  footer{
    text-align:center;
    margin-top:20px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--muted);
  }
  footer a{ color:var(--lavender); text-decoration:none; }

  @media (max-width:420px){
    .temp{ font-size:52px; }
    .card{ padding:28px 20px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="top-label">Current Weather</div>

  <form class="search" id="searchForm">
    <input type="text" id="cityInput" placeholder="Search a city — e.g. Islamabad" autocomplete="off" />
    <button type="submit" id="searchBtn">Search</button>
  </form>

  <button class="geo-btn" id="geoBtn">Use my current location</button>

  <div class="card">
    <div class="state-msg" id="stateMsg">Search a city or use your location to see live conditions.</div>

    <div class="result" id="result">
      <div class="place" id="placeName">—</div>
      <div class="place-sub" id="placeSub">—</div>

      <div class="icon-wrap" id="iconWrap"></div>

      <div class="temp-row">
        <div class="temp" id="temp">—</div>
        <div class="unit-toggle">
          <button type="button" id="unitC" class="active">°C</button>
          <button type="button" id="unitF">°F</button>
        </div>
      </div>
      <div class="condition" id="condition">—</div>

      <div class="stats">
        <div class="stat">
          <div class="k">Feels like</div>
          <div class="v" id="feelsLike">—</div>
        </div>
        <div class="stat">
          <div class="k">Humidity</div>
          <div class="v" id="humidity">—</div>
        </div>
        <div class="stat">
          <div class="k">Wind</div>
          <div class="v" id="wind">—</div>
        </div>
      </div>

      <div class="updated" id="updated"></div>
    </div>
  </div>

  <footer>Data via <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> — no API key required.</footer>
</div>

<script>
  const searchForm = document.getElementById('searchForm');
  const cityInput = document.getElementById('cityInput');
  const searchBtn = document.getElementById('searchBtn');
  const geoBtn = document.getElementById('geoBtn');
  const stateMsg = document.getElementById('stateMsg');
  const result = document.getElementById('result');

  const placeName = document.getElementById('placeName');
  const placeSub = document.getElementById('placeSub');
  const iconWrap = document.getElementById('iconWrap');
  const tempEl = document.getElementById('temp');
  const conditionEl = document.getElementById('condition');
  const feelsLikeEl = document.getElementById('feelsLike');
  const humidityEl = document.getElementById('humidity');
  const windEl = document.getElementById('wind');
  const updatedEl = document.getElementById('updated');
  const unitC = document.getElementById('unitC');
  const unitF = document.getElementById('unitF');

  let currentUnit = 'C';
  let lastData = null; // stores raw temps in C for unit conversion

  // WMO weather code -> { label, icon }
  const WEATHER_CODES = {
    0: { label: 'Clear sky', icon: 'sun' },
    1: { label: 'Mainly clear', icon: 'sun-cloud' },
    2: { label: 'Partly cloudy', icon: 'sun-cloud' },
    3: { label: 'Overcast', icon: 'cloud' },
    45: { label: 'Fog', icon: 'fog' },
    48: { label: 'Depositing rime fog', icon: 'fog' },
    51: { label: 'Light drizzle', icon: 'rain' },
    53: { label: 'Drizzle', icon: 'rain' },
    55: { label: 'Dense drizzle', icon: 'rain' },
    56: { label: 'Freezing drizzle', icon: 'rain' },
    57: { label: 'Dense freezing drizzle', icon: 'rain' },
    61: { label: 'Slight rain', icon: 'rain' },
    63: { label: 'Rain', icon: 'rain' },
    65: { label: 'Heavy rain', icon: 'rain' },
    66: { label: 'Freezing rain', icon: 'rain' },
    67: { label: 'Heavy freezing rain', icon: 'rain' },
    71: { label: 'Slight snow', icon: 'snow' },
    73: { label: 'Snow', icon: 'snow' },
    75: { label: 'Heavy snow', icon: 'snow' },
    77: { label: 'Snow grains', icon: 'snow' },
    80: { label: 'Slight showers', icon: 'rain' },
    81: { label: 'Showers', icon: 'rain' },
    82: { label: 'Violent showers', icon: 'rain' },
    85: { label: 'Slight snow showers', icon: 'snow' },
    86: { label: 'Heavy snow showers', icon: 'snow' },
    95: { label: 'Thunderstorm', icon: 'storm' },
    96: { label: 'Thunderstorm, hail', icon: 'storm' },
    99: { label: 'Thunderstorm, heavy hail', icon: 'storm' }
  };

  const ICONS = {
    sun: `<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="13" fill="#FF8966"/><g stroke="#FF8966" stroke-width="3.4" stroke-linecap="round"><line x1="32" y1="4" x2="32" y2="12"/><line x1="32" y1="52" x2="32" y2="60"/><line x1="4" y1="32" x2="12" y2="32"/><line x1="52" y1="32" x2="60" y2="32"/><line x1="12.3" y1="12.3" x2="18" y2="18"/><line x1="46" y1="46" x2="51.7" y2="51.7"/><line x1="12.3" y1="51.7" x2="18" y2="46"/><line x1="46" y1="18" x2="51.7" y2="12.3"/></g></svg>`,
    'sun-cloud': `<svg viewBox="0 0 64 64" fill="none"><circle cx="24" cy="24" r="10" fill="#FF8966"/><g stroke="#FF8966" stroke-width="3" stroke-linecap="round"><line x1="24" y1="2" x2="24" y2="8"/><line x1="8" y1="18" x2="12.5" y2="21"/><line x1="6" y1="34" x2="12" y2="34"/></g><path d="M18 46c-6 0-10-4.5-10-10 0-5.2 3.9-9.5 8.9-10 1.9-5.4 7-9.3 13-9.3 6.7 0 12.4 4.8 13.6 11.2C49.6 28.4 54 33 54 38.5 54 44.3 49.3 49 43.5 49H18z" fill="#A9B4E8" opacity="0.9"/></svg>`,
    cloud: `<svg viewBox="0 0 64 64" fill="none"><path d="M16 46c-6.6 0-12-5.4-12-12 0-6.2 4.7-11.3 10.7-11.9C16.9 15.4 23.3 10 31 10c8 0 14.8 5.8 16.2 13.4C53.4 24.6 58 30 58 36.5 58 43.4 52.4 49 45.5 49H16z" fill="#A9B4E8"/></svg>`,
    fog: `<svg viewBox="0 0 64 64" fill="none"><path d="M18 30c-5.5 0-10-4.5-10-10 0-5.2 3.9-9.5 9-10C18.4 4.6 24 0 30.7 0c6.6 0 12.3 4.8 13.5 11.2C49.4 12.3 54 17.5 54 23.5c0 6.9-5.6 12.5-12.5 12.5H18z" fill="#8A93BE" transform="translate(0,4)"/><g stroke="#9095B8" stroke-width="3.2" stroke-linecap="round"><line x1="8" y1="44" x2="56" y2="44"/><line x1="14" y1="52" x2="50" y2="52"/><line x1="20" y1="60" x2="44" y2="60"/></g></svg>`,
    rain: `<svg viewBox="0 0 64 64" fill="none"><path d="M16 38c-6.6 0-12-5.4-12-12 0-6.2 4.7-11.3 10.7-11.9C16.9 7.4 23.3 2 31 2c8 0 14.8 5.8 16.2 13.4C53.4 16.6 58 22 58 28.5 58 35.4 52.4 41 45.5 41H16z" fill="#A9B4E8"/><g stroke="#7FA8FF" stroke-width="3.2" stroke-linecap="round"><line x1="20" y1="48" x2="16" y2="58"/><line x1="32" y1="48" x2="28" y2="58"/><line x1="44" y1="48" x2="40" y2="58"/></g></svg>`,
    snow: `<svg viewBox="0 0 64 64" fill="none"><path d="M16 34c-6.6 0-12-5.4-12-12 0-6.2 4.7-11.3 10.7-11.9C16.9 3.4 23.3 -2 31 -2c8 0 14.8 5.8 16.2 13.4C53.4 12.6 58 18 58 24.5 58 31.4 52.4 37 45.5 37H16z" fill="#B9C2ED" transform="translate(0,6)"/><g stroke="#DDE3FF" stroke-width="2.6" stroke-linecap="round"><line x1="20" y1="50" x2="20" y2="60"/><line x1="15.5" y1="52.5" x2="24.5" y2="57.5"/><line x1="24.5" y1="52.5" x2="15.5" y2="57.5"/><line x1="44" y1="50" x2="44" y2="60"/><line x1="39.5" y1="52.5" x2="48.5" y2="57.5"/><line x1="48.5" y1="52.5" x2="39.5" y2="57.5"/></g></svg>`,
    storm: `<svg viewBox="0 0 64 64" fill="none"><path d="M16 32c-6.6 0-12-5.4-12-12 0-6.2 4.7-11.3 10.7-11.9C16.9 1.4 23.3 -4 31 -4c8 0 14.8 5.8 16.2 13.4C53.4 10.6 58 16 58 22.5 58 29.4 52.4 35 45.5 35H16z" fill="#8A93BE" transform="translate(0,8)"/><path d="M34 42l-9 14h7l-4 10 12-16h-7l3-8z" fill="#FF8966"/></svg>`
  };

  function setState(msg, isError){
    stateMsg.textContent = msg;
    stateMsg.classList.toggle('error', !!isError);
    stateMsg.style.display = 'block';
    result.classList.remove('visible');
  }

  function cToF(c){ return (c * 9/5) + 32; }

  function renderTemp(){
    if(!lastData) return;
    const c = lastData.temperature;
    const feels = lastData.apparent;
    const shown = currentUnit === 'C' ? c : cToF(c);
    const shownFeels = currentUnit === 'C' ? feels : cToF(feels);
    tempEl.textContent = Math.round(shown) + '°';
    feelsLikeEl.textContent = Math.round(shownFeels) + '°' + currentUnit;
    unitC.classList.toggle('active', currentUnit === 'C');
    unitF.classList.toggle('active', currentUnit === 'F');
  }

  async function fetchWeatherByCoords(lat, lon, label, sub){
    setState('Loading current conditions…');
    searchBtn.disabled = true;
    try{
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m&timezone=auto`;
      const res = await fetch(url);
      if(!res.ok) throw new Error('Weather request failed');
      const data = await res.json();
      const c = data.current;

      lastData = { temperature: c.temperature_2m, apparent: c.apparent_temperature };

      const wc = WEATHER_CODES[c.weather_code] || { label: 'Unknown', icon: 'cloud' };
      iconWrap.innerHTML = ICONS[wc.icon] || ICONS.cloud;
      conditionEl.textContent = wc.label;
      humidityEl.textContent = Math.round(c.relative_humidity_2m) + '%';
      windEl.textContent = Math.round(c.wind_speed_10m) + ' km/h';

      placeName.textContent = label;
      placeSub.textContent = sub;

      const now = new Date();
      updatedEl.textContent = 'Updated ' + now.toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });

      renderTemp();
      stateMsg.style.display = 'none';
      result.classList.add('visible');
    }catch(err){
      console.error('Weather fetch error:', err);
      setState('Could not load weather data. Please try again.', true);
    }finally{
      searchBtn.disabled = false;
    }
  }

  async function geocode(name){
    const geoUrl = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=10&language=en&format=json`;
    const res = await fetch(geoUrl);
    if(!res.ok) throw new Error('Geocoding request failed with status ' + res.status);
    const data = await res.json();
    return data.results || [];
  }

  async function searchCity(name){
    const query = name.trim();
    if(!query) return;

    setState('Searching…');
    searchBtn.disabled = true;
    try{
      let results = await geocode(query);

      // Fallback: some short/local place names match better without
      // trailing words (e.g. "Attock City" -> "Attock").
      if(results.length === 0 && query.includes(' ')){
        results = await geocode(query.split(' ')[0]);
      }

      if(results.length === 0){
        setState(`No matching place found for "${query}". Check the spelling, or try a nearby larger city.`, true);
        searchBtn.disabled = false;
        return;
      }

      // Prefer the most populous / most relevant match instead of blindly
      // taking the first result, so smaller towns resolve correctly.
      results.sort((a, b) => (b.population || 0) - (a.population || 0));
      const place = results[0];

      const sub = [place.admin1, place.country].filter(Boolean).join(', ');
      await fetchWeatherByCoords(place.latitude, place.longitude, place.name, sub);
    }catch(err){
      console.error('Weather search error:', err);
      setState('Could not reach the weather service. Check your internet connection and try again.', true);
      searchBtn.disabled = false;
    }
  }

  searchForm.addEventListener('submit', function(e){
    e.preventDefault();
    const val = cityInput.value.trim();
    if(!val) return;
    searchCity(val);
  });

  geoBtn.addEventListener('click', function(){
    if(!navigator.geolocation){
      setState('Geolocation is not supported by your browser.', true);
      return;
    }
    setState('Getting your location…');
    navigator.geolocation.getCurrentPosition(
      function(pos){
        fetchWeatherByCoords(pos.coords.latitude, pos.coords.longitude, 'Your location', '');
      },
      function(){
        setState('Location access denied. Try searching a city instead.', true);
      }
    );
  });

  unitC.addEventListener('click', function(){ currentUnit = 'C'; renderTemp(); });
  unitF.addEventListener('click', function(){ currentUnit = 'F'; renderTemp(); });

  // Load a sensible default on first visit
  searchCity('Islamabad');
</script>

</body>
</html>
